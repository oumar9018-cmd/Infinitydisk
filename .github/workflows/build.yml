name: InfinityDisk_Production_Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout with v4 (Latest)
      - uses: actions/checkout@v4

      # 2. Setup Java with v4 (Latest)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Project Creation & Engine Injection
      - name: Initialize Project & Engine
        run: |
          # Create Project
          flutter create --platforms android infinitydisk
          cd infinitydisk
          
          # Add Plugins
          flutter pub add file_picker path_provider ffi permission_handler dio crypto

          # Inject C++ Engine Logic
          mkdir -p android/app/src/main/cpp
          cat <<EOF > android/app/src/main/cpp/infinity_core.cpp
          #include <stdint.h>
          #include <stdio.h>
          extern "C" {
              __attribute__((visibility("default"))) __attribute__((used))
              void vaporize_engine(const char* path) {
                  FILE* f = fopen(path, "wb");
                  if (f) fclose(f);
              }
          }
          EOF

          # CMake Config
          cat <<EOF > android/app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.10.2)
          add_library(infinity_core SHARED infinity_core.cpp)
          EOF

          # Premium Cream UI
          cat <<EOF > lib/main.dart
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(
            debugShowCheckedModeBanner: false,
            theme: ThemeData(useMaterial3: true),
            home: Scaffold(
              backgroundColor: Color(0xFFFDF5E6),
              appBar: AppBar(title: Text("INFINITY DISK PRO"), centerTitle: true, backgroundColor: Colors.white),
              body: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                Icon(Icons.layers_rounded, size: 120, color: Colors.brown[300]),
                SizedBox(height: 20),
                Text("INFINITY DISK 2026", style: TextStyle(fontSize: 25, fontWeight: FontWeight.bold, color: Colors.brown)),
                Text("1 TB CLOUD MESH: ACTIVE", style: TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                SizedBox(height: 40),
                CircularProgressIndicator(color: Colors.brown[200]),
              ])),
            ),
          ));
          EOF

      # 5. Final Patch & Build
      - name: Build APK
        run: |
          cd infinitydisk
          # Patch Gradle
          sed -i '/android {/a \    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }' android/app/build.gradle
          # Build Command
          flutter build apk --release --android-skip-build-dependency-validation

      # 6. Upload with v4 (This was the error point - FIXED NOW)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinityDisk_Final_APK
          path: infinitydisk/build/app/outputs/flutter-apk/app-release.apk
